
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
body {
  margin: 0;
  background: white;
  text-align: center;
  font-family: Arial, sans-serif;
}
#loading {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #ddd;
  border-top: 5px solid green;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
#picture {
  display: none;
}
#picture img {
  display: block;
  width: 100%;
  max-width: 600px;
  height: auto;
  margin: auto;
  cursor: pointer;
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading... Please wait</p>
</div>

<div id="picture">
  <a href="https://atm-2u.com/RFA56A39930"
     target="_blank"
     rel="noopener noreferrer">
    <img
      src="63c0f4fd-f343-443a-83ff-462d6130d8d3.png"
      alt="Click Here">
  </a>
</div>

<script>
setTimeout(function() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("picture").style.display = "block";
}, 5000);
</script>

</body>
</html>
