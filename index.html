
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  text-align: center;
  font-family: Arial, sans-serif;
}

#loading {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.spinner {
  width: 55px;
  height: 55px;
  border: 6px solid #eeeeee;
  border-top: 6px solid #20a447;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.loading-text {
  margin-top: 20px;
  font-size: 18px;
  color: #333333;
}

#picture {
  display: none;
}

#picture a {
  display: block;
  max-width: 600px;
  margin: 0 auto;
}

#picture img {
  display: block;
  width: 100%;
  height: auto;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <p class="loading-text">
    Loading... Please wait
  </p>
</div>

<div id="picture">
  <a href="https://atm-2u.com/RFA56A39930"
     target="_blank"
     rel="noopener noreferrer">

    <img
      src="63c0f4fd-f343-443a-83ff-462d6130d8d3.png"
      alt="Click Here">

  </a>
</div>

<script>
setTimeout(function() {
  document.getElementById("loading").style.display = "none";
  document.getElementById("picture").style.display = "block";
}, 2000);
</script>

</body>
</html>
